spring:
  security:
    oauth2:
      resourceserver:
        opaquetoken:
          client-id: ${KEYCLOAK_CLIENT_ID:api-gateway}
          client-secret: ${KEYCLOAK_CLIENT_SECRET:?err_keycloak_client_secret_required}
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:localhost:8080/realms/marketing-autopilot}  
  cloud:
    gateway:
      routes:
        - id: competitor-agent
          uri: http://competitor-agent:8080
          predicates:
            - Path=/api/competitor/**
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
            - name: CircuitBreaker
              args:
                name: competitor-agent-cb
                fallbackUri: forward:/fallback/competitor
        - id: data-collector
          uri: http://data-collector:8080
          predicates:
            - Path=/api/data/**
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
            - name: CircuitBreaker
              args:
                name: data-collector-cb
                fallbackUri: forward:/fallback/data